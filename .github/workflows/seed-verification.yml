name: Seed Verification

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  verify:
    name: ${{ matrix.game }} seed verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        game: [classic, emoji, timeline]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ vars.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate ${{ matrix.game }} seed
        run: pnpm run validate-${{ matrix.game }}-data

      - name: Merge and verify synchronized Classic seed
        if: matrix.game == 'classic' || matrix.game == 'timeline'
        run: |
          set -euo pipefail
          pnpm run classic-merge-to-one
          git diff --exit-code -- data/classic.seed.json

      - name: Merge and verify synchronized Timeline seed
        if: matrix.game == 'timeline'
        run: |
          set -euo pipefail
          pnpm run timeline-merge-to-one
          git diff --exit-code -- data/timeline.seed.json

