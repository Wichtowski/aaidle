name: Publish GitHub Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    outputs:
      tag:
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          image="${IMAGE_NAME,,}-api:$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes "API container image: \`$image\`"
          else
            gh release create "$RELEASE_TAG" --title "aAIdle $RELEASE_TAG" --generate-notes --notes "API container image: \`$image\`"
          fi
