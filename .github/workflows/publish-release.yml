name: Publish GitHub Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    outputs:
      tag:
        value: ${{ jobs.publish.outputs.tag }}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          image="${IMAGE_NAME,,}:$RELEASE_TAG"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes "Container image: \`$image\`"
          else
            gh release create "$RELEASE_TAG" --title "aAidle $RELEASE_TAG" --generate-notes --notes "Container image: \`$image\`"
          fi
      - name: Write summary
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          {
            echo "## Release $RELEASE_TAG"
            echo
            echo "- GitHub Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo "- Deployment waits for production approval"
          } >> "$GITHUB_STEP_SUMMARY"
