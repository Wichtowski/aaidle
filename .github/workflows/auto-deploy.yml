name: Release and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer increment, or skip
        required: true
        default: auto
        type: choice
        options: [skip, auto, patch, minor, major]

concurrency:
  group: aaidle-production-release
  cancel-in-progress: false

jobs:
  create-release-tag:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'AutoDeploy') }}
    uses: ./.github/workflows/create-release-tag.yml
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump || 'auto' }}
      source_ref: ${{ github.event_name == 'push' && github.sha || github.ref }}

  vitest-unit-tests:
    needs: create-release-tag
    uses: ./.github/workflows/vitest-unit-tests.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ needs.create-release-tag.outputs.tag }}

  rust-unit-tests:
    needs: create-release-tag
    uses: ./.github/workflows/rust-unit-tests.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ needs.create-release-tag.outputs.tag }}

  docker-build:
    needs: create-release-tag
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read
      packages: write
    with:
      release_tag: ${{ needs.create-release-tag.outputs.tag }}

  publish-release:
    needs: [create-release-tag, vitest-unit-tests, rust-unit-tests, docker-build]
    uses: ./.github/workflows/publish-release.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ needs.create-release-tag.outputs.tag }}

  deploy:
    needs: publish-release
    uses: ./.github/workflows/deploy-vps.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ needs.publish-release.outputs.tag }}
      environment: production
    secrets: inherit

  tests:
    needs: [deploy, publish-release]
    uses: ./.github/workflows/playwright-tests.yml
    permissions:
      actions: write
      contents: write
    with:
      release_tag: ${{ needs.publish-release.outputs.tag }}
      environment: production
    secrets: inherit
