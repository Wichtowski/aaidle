name: Release and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer increment, or skip
        required: true
        default: auto
        type: choice
        options: [skip, auto, patch, minor, major]

concurrency:
  group: aaidle-production-release
  cancel-in-progress: false

jobs:
  create-release-tag:
    uses: ./.github/workflows/create-release-tag.yml
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump || 'auto' }}
      source_ref: ${{ github.event_name == 'push' && github.sha || github.ref }}

  unit-tests:
    needs: create-release-tag
    uses: ./.github/workflows/unit-test.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ needs.create-release-tag.outputs.tag }}

  docker-build:
    needs: create-release-tag
    uses: ./.github/workflows/docker-build.yml
    permissions:
      contents: read
      packages: write
    with:
      release_tag: ${{ needs.create-release-tag.outputs.tag }}

  publish-release:
    needs: [create-release-tag, unit-tests, docker-build]
    uses: ./.github/workflows/publish-release.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ needs.create-release-tag.outputs.tag }}

  deploy:
    needs: publish-release
    uses: ./.github/workflows/deploy-vps.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ needs.publish-release.outputs.tag }}
    secrets: inherit

  production-e2e:
    needs: [deploy, publish-release]
    uses: ./.github/workflows/production-e2e.yml
    permissions:
      actions: write
      contents: read
      pages: write
      id-token: write
    with:
      release_tag: ${{ needs.publish-release.outputs.tag }}
