name: Deploy VPS Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      AAIDLE_VPS_HOST:
        required: true
      AAIDLE_VPS_USER:
        required: true
      AAIDLE_VPS_SSH_KEY:
        required: true
      AAIDLE_DEPLOY_PATH:
        required: true
      AAIDLE_DAILY_SELECTION_SECRET:
        required: true
      AAIDLE_AUTH_SECRET:
        required: false
      AAIDLE_GITHUB_CLIENT_ID:
        required: false
      AAIDLE_GITHUB_CLIENT_SECRET:
        required: false
      AAIDLE_GOOGLE_CLIENT_ID:
        required: false
      AAIDLE_GOOGLE_CLIENT_SECRET:
        required: false
      AAIDLE_RESEND_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aaidle.com
    env:
      DEPLOY_PATH: ${{ secrets.AAIDLE_DEPLOY_PATH }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Create production environment file
        env:
          AAIDLE_DAILY_SELECTION_SECRET: ${{ secrets.AAIDLE_DAILY_SELECTION_SECRET }}
          AAIDLE_AUTH_SECRET: ${{ secrets.AAIDLE_AUTH_SECRET }}
          AAIDLE_GITHUB_CLIENT_ID: ${{ secrets.AAIDLE_GITHUB_CLIENT_ID }}
          AAIDLE_GITHUB_CLIENT_SECRET: ${{ secrets.AAIDLE_GITHUB_CLIENT_SECRET }}
          AAIDLE_GOOGLE_CLIENT_ID: ${{ secrets.AAIDLE_GOOGLE_CLIENT_ID }}
          AAIDLE_GOOGLE_CLIENT_SECRET: ${{ secrets.AAIDLE_GOOGLE_CLIENT_SECRET }}
          AAIDLE_RESEND_API_KEY: ${{ secrets.AAIDLE_RESEND_API_KEY }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          umask 077
          image="${IMAGE_NAME,,}"
          {
            printf 'DAILY_SELECTION_SECRET=%s\n' "$AAIDLE_DAILY_SELECTION_SECRET"
            printf 'APP_ORIGIN=%s\n' 'https://aaidle.com'
            printf 'AUTH_SECRET=%s\n' "$AAIDLE_AUTH_SECRET"
            printf 'GITHUB_CLIENT_ID=%s\n' "$AAIDLE_GITHUB_CLIENT_ID"
            printf 'GITHUB_CLIENT_SECRET=%s\n' "$AAIDLE_GITHUB_CLIENT_SECRET"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$AAIDLE_GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$AAIDLE_GOOGLE_CLIENT_SECRET"
            printf 'RESEND_API_KEY=%s\n' "$AAIDLE_RESEND_API_KEY"
            printf 'AAIDLE_IMAGE=%s\n' "$image"
            printf 'AAIDLE_VERSION=%s\n' "$RELEASE_TAG"
          } > aaidle.env
      - name: Copy runtime configuration to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.AAIDLE_VPS_HOST }}
          username: ${{ secrets.AAIDLE_VPS_USER }}
          key: ${{ secrets.AAIDLE_VPS_SSH_KEY }}
          source: compose.prod.yml,aaidle.env
          target: /tmp
      - name: Deploy approved release
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.AAIDLE_VPS_HOST }}
          username: ${{ secrets.AAIDLE_VPS_USER }}
          key: ${{ secrets.AAIDLE_VPS_SSH_KEY }}
          command_timeout: 20m
          envs: DEPLOY_PATH,RELEASE_TAG
          script: |
            set -euo pipefail

            runtime_dir="${DEPLOY_PATH}/runtime"
            staging_dir=$(mktemp -d "${DEPLOY_PATH}/.deploy.XXXXXX")
            trap 'rm -rf "$staging_dir"' EXIT

            mv /tmp/compose.prod.yml "$staging_dir/compose.prod.yml"
            mv /tmp/aaidle.env "$staging_dir/.env"
            chmod 600 "$staging_dir/.env"

            cd "$staging_dir"
            docker compose --env-file .env -f compose.prod.yml pull app
            docker compose --env-file .env -f compose.prod.yml up -d --remove-orphans
            docker compose --env-file .env -f compose.prod.yml ps


            rm -rf "$runtime_dir"
            mv "$staging_dir" "$runtime_dir"
            trap - EXIT
            rm -rf "${DEPLOY_PATH}/app" "${DEPLOY_PATH}/releases" "${DEPLOY_PATH}/current"
      - name: Write summary
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Release: $RELEASE_TAG"
            echo "- URL: https://aaidle.com"
          } >> "$GITHUB_STEP_SUMMARY"
