name: Deploy VPS Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      AAIDLE_VPS_HOST:
        required: true
      AAIDLE_VPS_USER:
        required: true
      AAIDLE_VPS_SSH_KEY:
        required: true
      AAIDLE_DEPLOY_PATH:
        required: true
      AAIDLE_DAILY_SELECTION_SECRET:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aaidle.com
    env:
      DEPLOY_PATH: ${{ secrets.AAIDLE_DEPLOY_PATH }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Download release from GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "aaidle-$RELEASE_TAG.tar.gz" \
            --dir .
      - name: Create production environment file
        env:
          AAIDLE_DAILY_SELECTION_SECRET: ${{ secrets.AAIDLE_DAILY_SELECTION_SECRET }}
        run: |
          umask 077
          {
            printf 'DAILY_SELECTION_SECRET=%s\n' "$AAIDLE_DAILY_SELECTION_SECRET"
            printf 'AAIDLE_VERSION=%s\n' "$RELEASE_TAG"
          } > aaidle.env
      - name: Copy release to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AAIDLE_VPS_HOST }}
          username: ${{ secrets.AAIDLE_VPS_USER }}
          key: ${{ secrets.AAIDLE_VPS_SSH_KEY }}
          source: aaidle-${{ inputs.release_tag }}.tar.gz,aaidle.env
          target: /tmp
      - name: Deploy approved release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AAIDLE_VPS_HOST }}
          username: ${{ secrets.AAIDLE_VPS_USER }}
          key: ${{ secrets.AAIDLE_VPS_SSH_KEY }}
          command_timeout: 20m
          envs: DEPLOY_PATH,RELEASE_TAG
          script: |
            set -euo pipefail

            app_dir="${DEPLOY_PATH}/app"
            staging_dir=$(mktemp -d "${DEPLOY_PATH}/.deploy.XXXXXX")
            trap 'rm -rf "$staging_dir"' EXIT

            tar -xzf "/tmp/aaidle-${RELEASE_TAG}.tar.gz" -C "$staging_dir"
            mv /tmp/aaidle.env "$staging_dir/.env"
            chmod 600 "$staging_dir/.env"

            cd "$staging_dir"
            docker compose --env-file .env -f compose.prod.yml up -d --build --remove-orphans
            docker compose --env-file .env -f compose.prod.yml ps

            rm -rf "$app_dir"
            mv "$staging_dir" "$app_dir"
            trap - EXIT
            rm -rf "${DEPLOY_PATH}/releases" "${DEPLOY_PATH}/current"
            rm -f "/tmp/aaidle-${RELEASE_TAG}.tar.gz"
      - name: Write summary
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Release: $RELEASE_TAG"
            echo "- URL: https://aaidle.com"
          } >> "$GITHUB_STEP_SUMMARY"
