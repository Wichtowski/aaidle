name: Deploy VPS Release

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true
      AIDLE_DEPLOY_PATH:
        required: true
      AIDLE_DAILY_SELECTION_SECRET:
        required: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aaidle.com
    env:
      DEPLOY_PATH: ${{ secrets.AIDLE_DEPLOY_PATH }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aidle-${{ inputs.release_tag }}
          path: artifact
      - name: Prepare release upload
        run: mv "artifact/aidle-$RELEASE_TAG.tar.gz" "aidle-$RELEASE_TAG.tar.gz"
      - name: Create production environment file
        env:
          DAILY_SELECTION_SECRET: ${{ secrets.AIDLE_DAILY_SELECTION_SECRET }}
        run: |
          umask 077
          printf 'DAILY_SELECTION_SECRET=%s\n' "$DAILY_SELECTION_SECRET" > aidle.env
      - name: Copy release to VPS
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: aidle-${{ inputs.release_tag }}.tar.gz,aidle.env
          target: /tmp
      - name: Deploy approved release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          envs: DEPLOY_PATH,RELEASE_TAG
          script: |
            set -euo pipefail

            app_dir="${DEPLOY_PATH}/app"
            staging_dir=$(mktemp -d "${DEPLOY_PATH}/.deploy.XXXXXX")
            trap 'rm -rf "$staging_dir"' EXIT

            tar -xzf "/tmp/aidle-${RELEASE_TAG}.tar.gz" -C "$staging_dir"
            mv /tmp/aidle.env "$staging_dir/.env"
            chmod 600 "$staging_dir/.env"

            cd "$staging_dir"
            docker compose --env-file .env -f compose.prod.yml up -d --build --remove-orphans
            docker compose --env-file .env -f compose.prod.yml ps

            rm -rf "$app_dir"
            mv "$staging_dir" "$app_dir"
            trap - EXIT
            rm -rf "${DEPLOY_PATH}/releases" "${DEPLOY_PATH}/current"
            rm -f "/tmp/aidle-${RELEASE_TAG}.tar.gz"
      - name: Write summary
        run: |
          {
            echo "## Production deployment"
            echo
            echo "- Release: $RELEASE_TAG"
            echo "- URL: https://aaidle.com"
          } >> "$GITHUB_STEP_SUMMARY"
