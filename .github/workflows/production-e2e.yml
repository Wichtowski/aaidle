name: Production Quality Reports

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "${{ inputs.release_tag }}"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - env:
          AAIDLE_VERSION: "${{ inputs.release_tag }}"
        run: pnpm exec playwright test --config=tests/configs/playwright.config.ts --project=release-readiness

  e2e:
    needs: readiness
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "${{ inputs.release_tag }}"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Run browser end-to-end tests
        env:
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: pnpm exec playwright test --config=tests/configs/playwright.config.ts --no-deps --project=chromium --project=mobile-chromium
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results
          path: tests/reports/allure-results
          if-no-files-found: ignore

  api:
    needs: readiness
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "${{ inputs.release_tag }}"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          AAIDLE_VERSION: "${{ inputs.release_tag }}"
          PLAYWRIGHT_HEALTH_KEY: "${{ secrets.AAIDLE_HEALTH_KEY }}"
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        run: pnpm exec playwright test --config=tests/configs/playwright.api.config.ts --no-deps --project=production-api
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-allure-results
          path: tests/reports/api-allure-results
          if-no-files-found: ignore

  accessibility:
    needs: readiness
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "${{ inputs.release_tag }}"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Cache Playwright Chromium
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium
      - name: Run accessibility tests
        id: accessibility-tests
        continue-on-error: true
        run: pnpm exec playwright test --config=tests/configs/playwright.accessibility.config.ts --no-deps --project=accessibility
      - name: Add accessibility result to job summary
        if: always()
        env:
          ACCESSIBILITY_OUTCOME: ${{ steps.accessibility-tests.outcome }}
        run: |
          if [ "$ACCESSIBILITY_OUTCOME" = "failure" ]; then
            {
              echo "## Accessibility checks"
              echo
              echo "> [!WARNING]"
              echo "> Accessibility violations were detected. This is non-blocking for deployment."
              echo
              echo "See the **Run accessibility tests** step and the accessibility report artifact for details."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Accessibility checks"
              echo
              echo "Accessibility checks passed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build accessibility report
        if: always()
        run: node .github/scripts/build-accessibility-report.mjs

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-report
          path: tests/reports/accessibility

  performance:
    needs: readiness
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "${{ inputs.release_tag }}"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Lighthouse
        run: |
          mkdir -p tests/reports/performance
          pnpm exec lighthouse https://aaidle.com \
            --config-path=tests/configs/lighthouse.config.mjs \
            --chrome-flags="--headless=new --no-sandbox" \
            --output html \
            --output json \
            --output-path=tests/reports/performance/home
          mv tests/reports/performance/home.report.html tests/reports/performance/index.html
          mv tests/reports/performance/home.report.json tests/reports/performance/metrics.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-report
          path: tests/reports/performance

  publish-reports:
    if: always()
    environment: production
    needs: [e2e, api, accessibility, performance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: "${{ inputs.release_tag }}"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: allure-results
          path: reports/allure-results
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: api-allure-results
          path: reports/api-allure-results
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: accessibility-report
          path: reports/accessibility
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: performance-report
          path: reports/performance
      - run: pnpm exec allure generate reports/allure-results --clean --output report-site/e2e
      - run: pnpm exec allure generate reports/api-allure-results --clean --output report-site/api
      - name: Publish report history
        env:
          RELEASE_TAG: "${{ inputs.release_tag }}"
          GH_TOKEN: ${{ github.token }}
          PAGES_CUSTOM_DOMAIN: reports.aaidle.com
        run: node .github/scripts/publish-production-reports.mjs
