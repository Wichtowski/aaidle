name: Docker Build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  build:
    name: Docker build test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Build and initialize production image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          docker build --build-arg "AAIDLE_VERSION=$RELEASE_TAG" --tag "aaidle:$RELEASE_TAG" .
          docker run --rm --entrypoint sh "aaidle:$RELEASE_TAG" -ec '
            DATABASE_PATH=/tmp/aaidle.db node scripts/migrate.mjs
            DATABASE_PATH=/tmp/aaidle.db node scripts/seed.mjs
          '
