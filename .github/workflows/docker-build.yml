name: Docker Build

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  build:
    name: Test and publish container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Build and initialize production image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME,,}:$RELEASE_TAG"
          docker build --build-arg "AAIDLE_VERSION=$RELEASE_TAG" --tag "$image" .
          docker run --rm --entrypoint sh "$image" -ec '
            DATABASE_PATH=/tmp/aaidle.db node scripts/migrate.mjs
            DATABASE_PATH=/tmp/aaidle.db node scripts/seed.mjs
          '
      - name: Sign in to GitHub Container Registry
        run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Publish tagged image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: docker push "${IMAGE_NAME,,}:$RELEASE_TAG"
