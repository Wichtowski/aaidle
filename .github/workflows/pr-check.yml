name: Pull Request Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

jobs:
  check:
    if: github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run check
        id: initial-check
        continue-on-error: true
        run: pnpm check
      - name: Confirm failures are limited to lint
        if: steps.initial-check.outcome == 'failure'
        run: |
          pnpm typecheck
          pnpm test
      - name: Diagnose lint failure
        id: lint
        if: steps.initial-check.outcome == 'failure'
        continue-on-error: true
        run: pnpm lint
      - name: Format and commit the PR branch
        id: format
        if: steps.initial-check.outcome == 'failure' && steps.lint.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          pnpm format --fix
          if git diff --quiet; then
            echo "formatted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm lint
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          git commit -m "style: format pull request"
          git push origin "HEAD:$PR_BRANCH"
          echo "formatted=true" >> "$GITHUB_OUTPUT"
      - name: Explain fork formatting restriction
        if: steps.initial-check.outcome == 'failure' && steps.lint.outcome == 'failure' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "## Formatting required" >> "$GITHUB_STEP_SUMMARY"
          echo "This fork PR cannot be modified by the repository token." >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Verify final check
        if: steps.initial-check.outcome == 'failure' && steps.lint.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm check
      - name: Fail non-lint check failures
        if: steps.initial-check.outcome == 'failure' && steps.lint.outcome == 'success'
        run: exit 1
