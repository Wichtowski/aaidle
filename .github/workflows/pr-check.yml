name: Pull Request Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    if: github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ vars.PNPM_VERSION }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check

  vitest:
    name: Vitest unit tests
    if: github.event.pull_request.head.ref != 'main'
    uses: ./.github/workflows/vitest-unit-tests.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ github.event.pull_request.head.sha }}

  frontend-verification:
    uses: ./.github/workflows/frontend-verification.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ github.event.pull_request.head.sha }}

  seed-verification:
    name: Seed verification
    if: github.event.pull_request.head.ref != 'main'
    uses: ./.github/workflows/seed-verification.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ github.event.pull_request.head.sha }}

  rust:
    name: Rust build and test
    if: github.event.pull_request.head.ref != 'main'
    uses: ./.github/workflows/rust-unit-tests.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ github.event.pull_request.head.sha }}

  test-summary:
    name: Publish test summaries
    if: always()
    needs: [vitest, rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download TypeScript test report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: typescript-test-report
          path: reports/typescript
      - name: Download Rust coverage report
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: backend-coverage-report
          path: reports/rust
      - name: Build pull request test summaries
        shell: bash
        run: |
          {
            if [[ -s reports/typescript/typescript-test-summary.md ]]; then
              sed '1s/^### TypeScript$/## 🧪 TypeScript tests/' \
                reports/typescript/typescript-test-summary.md
            else
              echo "## 🧪 TypeScript tests"
              echo
              echo "Test report unavailable."
            fi
            echo
            echo "<sub>Updated by the \\`Pull Request Check / Publish test summaries\\` workflow.</sub>"
          } > reports/typescript-test-summary.md
          {
            if [[ -s reports/rust/rust-test-summary.md ]]; then
              cat reports/rust/rust-test-summary.md
            else
              echo "## 🦀 Rust tests"
              echo
              echo "Test report unavailable."
            fi
            echo
            echo "<sub>Updated by the \\`Pull Request Check / Publish test summaries\\` workflow.</sub>"
          } > reports/rust-test-summary.md
      - name: Remove legacy combined test summary comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: test-summary
          delete: true
      - name: Update TypeScript test summary comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: typescript-test-summary
          path: reports/typescript-test-summary.md
          skip_unchanged: true
      - name: Update Rust test summary comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: rust-test-summary
          path: reports/rust-test-summary.md
          skip_unchanged: true
