name: Rust Unit Tests

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

env:
  RUST_COVERAGE_TOOLCHAIN: nightly-2026-08-17

jobs:
  test:
    name: Rust tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ vars.NODE_VERSION }}
      - name: Install coverage toolchain
        run: rustup toolchain install ${{ env.RUST_COVERAGE_TOOLCHAIN }} --profile minimal --component llvm-tools-preview
      - name: Install Rust test tools
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-llvm-cov@0.9.0,cargo-nextest@0.9.143
          fallback: none
      - name: Run Rust tests in parallel
        id: rust-tests
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: |
          set -o pipefail
          cargo +"$RUST_COVERAGE_TOOLCHAIN" llvm-cov clean --workspace
          cargo +"$RUST_COVERAGE_TOOLCHAIN" llvm-cov nextest \
            --locked \
            --branch \
            --no-report \
            --no-fail-fast \
            2>&1 | tee "$RUNNER_TEMP/rust-test-output"
      - name: Write Rust test report
        if: always()
        shell: bash
        run: |
          summary=$(grep -E 'Summary .* tests run:' "$RUNNER_TEMP/rust-test-output" | tail -1 || true)
          passed=0
          failed=0
          ignored=0
          if [[ "$summary" =~ ([0-9]+)[[:space:]]passed ]]; then
            passed="${BASH_REMATCH[1]}"
          fi
          if [[ "$summary" =~ ([0-9]+)[[:space:]]failed ]]; then
            failed="${BASH_REMATCH[1]}"
          fi
          if [[ "$summary" =~ ([0-9]+)[[:space:]]skipped ]]; then
            ignored="${BASH_REMATCH[1]}"
          fi
          mkdir -p tests/reports/backend-coverage
          {
            echo "## 🦀 Rust tests"
            echo
            echo "| Namespace | Passed | Failed | Ignored |"
            echo "| --- | ---: | ---: | ---: |"
            printf '| Backend | %s | %s | %s |\n' "$passed" "$failed" "$ignored"
            echo
            echo "**Total:** ${passed} passed · ${failed} failed · ${ignored} ignored ($((passed + failed)) executed)"
          } > tests/reports/backend-coverage/rust-test-summary.md
      - name: Generate backend coverage reports
        working-directory: backend
        run: |
          cargo +"$RUST_COVERAGE_TOOLCHAIN" llvm-cov report \
            --branch \
            --html \
            --ignore-filename-regex '(^|/)tests/|/tests\.rs$|(^|/)src/bin/' \
            --output-dir ../tests/reports/backend-coverage
          cargo +"$RUST_COVERAGE_TOOLCHAIN" llvm-cov report \
            --branch \
            --json \
            --summary-only \
            --ignore-filename-regex '(^|/)tests/|/tests\.rs$|(^|/)src/bin/' \
            --output-path ../tests/reports/backend-coverage/coverage-summary.json
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";

          const reportPath = "../tests/reports/backend-coverage/coverage-summary.json";
          const report = JSON.parse(await readFile(reportPath, "utf8"));
          const totals = report.data?.[0]?.totals;
          if (!totals) throw new Error("Backend coverage totals are unavailable.");

          const rows = ["lines", "functions", "regions", "branches"]
            .map((name) => `| ${name} | ${totals[name].percent.toFixed(2)}% |`)
            .join("\n");
          await appendFile(
            "../tests/reports/backend-coverage/rust-test-summary.md",
            `\n## Coverage\n\n| Metric | Covered |\n| --- | ---: |\n${rows}\n`,
          );
          NODE
          node ../scripts/check-rust-coverage.mjs \
            ../tests/reports/backend-coverage/coverage-summary.json
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-report
          path: tests/reports/backend-coverage
          if-no-files-found: error
      - name: Fail when Rust tests failed
        if: always() && steps.rust-tests.outcome == 'failure'
        run: exit 1
