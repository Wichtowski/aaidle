name: Rust Unit Tests

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
      - name: Install Rust
        run: rustup toolchain install ${{ vars.RUST_TOOLCHAIN }} --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: cargo-llvm-cov@0.9.0
          fallback: none
      - name: Run Rust unit tests
        uses: ./.github/actions/unit-test/rust
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-report
          path: tests/reports/backend-coverage
          if-no-files-found: error
