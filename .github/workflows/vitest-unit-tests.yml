name: Vitest Unit Tests

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

jobs:
  test:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.5.3
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate frontend
        run: |
          pnpm db:validate-seed
          pnpm ci:validate-actions
          pnpm typecheck
          pnpm lint
      - name: Run Vitest unit tests
        run: pnpm test
      - name: Add Vitest test report to summary
        if: always()
        run: |
          vitest_passed=$(jq '.numPassedTests // 0' tests/reports/vitest.json)
          vitest_total=$(jq '.numTotalTests // 0' tests/reports/vitest.json)
          vitest_status="✅"
          if [[ "$(jq -r '.success' tests/reports/vitest.json)" != "true" ]]; then
            vitest_status="❌"
          fi
          {
            echo "## 🧪 Unit Test Report"
            echo
            echo "${vitest_status} ${vitest_passed} passed · ${vitest_total} total"
          } >> "$GITHUB_STEP_SUMMARY"
