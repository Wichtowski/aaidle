name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      bump:
        description: SemVer increment
        required: true
        default: auto
        type: choice
        options: [auto, initial, patch, minor, major]
      source_ref:
        description: Branch, tag, or commit to tag
        required: true
        default: main
        type: string
  workflow_call:
    inputs:
      bump:
        description: SemVer increment
        required: true
        type: string
      source_ref:
        description: Commit to tag
        required: true
        type: string
    outputs:
      tag:
        description: Created SemVer tag
        value: ${{ jobs.create-tag.outputs.tag }}

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Calculate SemVer release tag
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          existing_tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          # Automatic releases are idempotent. An explicitly requested bump may
          # intentionally add a new SemVer tag to a commit that is already tagged.
          if [ "$BUMP" = "auto" ] && [ -n "$existing_tag" ]; then
            echo "tag=$existing_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)
          if [ -z "$latest_tag" ]; then
            if [ "$BUMP" != "auto" ] && [ "$BUMP" != "initial" ]; then
              echo "::error::The first release must use the initial bump"
              exit 1
            fi

            version=$(jq -r '.version' package.json)
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::package.json version is not valid SemVer: $version"
              exit 1
            fi
            next_tag="v$version"
          else
            if [ "$BUMP" = "initial" ]; then
              echo "::error::The initial bump can only create the first release"
              exit 1
            fi

            IFS='.' read -r major minor patch <<< "${latest_tag#v}"
            case "$BUMP" in
              auto|patch)
                patch=$((patch + 1))
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              *)
                echo "::error::Unsupported SemVer bump: $BUMP"
                exit 1
                ;;
            esac
            next_tag="v$major.$minor.$patch"
          fi

          if git rev-parse --verify --quiet "refs/tags/$next_tag" >/dev/null; then
            tag_commit=$(git rev-list -n 1 "$next_tag")
            source_commit=$(git rev-parse HEAD)
            if [ "$tag_commit" != "$source_commit" ]; then
              echo "::error::Release tag already exists for another commit: $next_tag"
              exit 1
            fi
            echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag --annotate "$RELEASE_TAG" --message "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
