name: TypeScript unit tests
description: Run Vitest unit tests with frontend coverage and write a test summary report

runs:
  using: composite
  steps:
    - name: Run Vitest unit tests
      shell: bash
      run: pnpm run test:unit:coverage

    - name: Write Vitest test report
      if: always()
      shell: bash
      run: |
        report_file="$RUNNER_TEMP/typescript-test-summary.md"
        if [[ ! -f tests/reports/vitest.json ]]; then
          {
            echo "### TypeScript"
            echo
            echo "| Passed | Failed | Total |"
            echo "| ---: | ---: | ---: |"
            echo "| 0 | — | — |"
            echo
            echo "> Vitest did not run because an earlier step failed."
          } > "$report_file"
          exit 0
        fi

        vitest_passed=$(jq '.numPassedTests // 0' tests/reports/vitest.json)
        vitest_total=$(jq '.numTotalTests // 0' tests/reports/vitest.json)
        vitest_failed=$(jq '.numFailedTests // 0' tests/reports/vitest.json)
        {
          echo "### TypeScript"
          echo
          echo "| Passed | Failed | Total |"
          echo "| ---: | ---: | ---: |"
          echo "| ${vitest_passed} | ${vitest_failed} | ${vitest_total} |"
        } > "$report_file"
