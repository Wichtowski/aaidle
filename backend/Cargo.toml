[package]
name = "aidle-api"
version = "1.0.0"
edition = "2024"
rust-version = "1.94"

[dependencies]
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["macros", "migrate", "runtime-tokio-rustls", "sqlite"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-br", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
temp-env = "=0.3.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
