services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: aidle-api:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AIDLE_BIND_ADDR: 0.0.0.0:8080
      DATABASE_URL: sqlite:///data/aidle.db
    ports:
      - "8080:8080"
    volumes:
      - aidle_api_data:/data
    mem_limit: 96m
    cpus: "1.0"
    pids_limit: 128

volumes:
  aidle_api_data:
