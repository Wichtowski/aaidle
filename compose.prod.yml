name: aaidle

services:
  app:
    image: ${AAIDLE_IMAGE}:${AAIDLE_VERSION}
    pull_policy: always
    container_name: aaidle-app
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/aaidle.db
      DAILY_SELECTION_SECRET: ${DAILY_SELECTION_SECRET}
      APP_ORIGIN: ${APP_ORIGIN}
      AUTH_SECRET: ${AUTH_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AAIDLE_VERSION: ${AAIDLE_VERSION:-dev}
      NODE_ENV: production
    volumes:
      - sqlite_data:/data
    networks:
      - edge
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: echotrade_app_net
    external: true

volumes:
  sqlite_data:
    name: aaidle_sqlite_data
