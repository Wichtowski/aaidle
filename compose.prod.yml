name: aaidle

services:
  api:
    image: ${AAIDLE_API_IMAGE}:${AAIDLE_VERSION}
    pull_policy: always
    container_name: aaidle-api
    restart: unless-stopped
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      AIDLE_ENV: production
      APP_ORIGIN: https://aaidle.com
      DAILY_SELECTION_SECRET: ${DAILY_SELECTION_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      HEALTH_KEY: ${HEALTH_KEY}
      AAIDLE_VERSION: ${AAIDLE_VERSION}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_ISSUES_TOKEN: ${GITHUB_ISSUES_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --header \"x-aaidle-health-key: $${HEALTH_KEY}\" http://127.0.0.1:8080/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 12
    volumes:
      - api_data:/data
    networks:
      - edge
    mem_limit: 128m
    cpus: "1.0"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  seed:
    image: ${AAIDLE_API_IMAGE}:${AAIDLE_VERSION}
    pull_policy: always
    container_name: aaidle-seed
    restart: "no"
    command: ["aidle-seed"]
    environment:
      AIDLE_ENV: production
      APP_ORIGIN: https://aaidle.com
      DAILY_SELECTION_SECRET: ${DAILY_SELECTION_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      HEALTH_KEY: ${HEALTH_KEY}
      AAIDLE_VERSION: ${AAIDLE_VERSION}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_ISSUES_TOKEN: ${GITHUB_ISSUES_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - api_data:/data
    networks:
      - edge

networks:
  edge:
    name: aaidle_edge_net
    external: true

volumes:
  api_data:
