[package]
name = "aaidle-seed-tui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
ratatui = "0.29"
